name: Android CI

on:
  push:
    branches: [main, milestone-2-connected-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM tests
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee build-logs/jvm-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lint --stacktrace 2>&1 | tee build-logs/android-lint.log

      - name: Build debug and release artifacts
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build-logs/android-build.log

      - name: Upload verification reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build-logs/**
            **/build/reports/**
            **/build/test-results/**

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          if-no-files-found: error
          retention-days: 14
          path: app/build/outputs/apk/**/*.apk
