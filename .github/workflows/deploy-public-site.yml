name: Validate and deploy public support site

on:
  pull_request:
    paths:
      - "docs/site/**"
      - "scripts/render_public_site.py"
      - ".github/workflows/deploy-public-site.yml"
  push:
    branches:
      - main
    paths:
      - "docs/site/**"
      - "scripts/render_public_site.py"
      - ".github/workflows/deploy-public-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-support-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEADDICT_DEVELOPER_NAME: ${{ vars.DEADDICT_DEVELOPER_NAME }}
      DEADDICT_SUPPORT_EMAIL: ${{ vars.DEADDICT_SUPPORT_EMAIL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render and validate static site
        shell: bash
        run: |
          set -euo pipefail
          developer_name="${DEADDICT_DEVELOPER_NAME:-DeAddict preview}"
          support_email="${DEADDICT_SUPPORT_EMAIL:-preview@deaddict.invalid}"
          args=(
            --source docs/site
            --output _site
            --developer-name "$developer_name"
            --support-email "$support_email"
          )
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            args+=(--require-public-identity)
          fi
          python3 scripts/render_public_site.py "${args[@]}"

      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public support site
        id: deployment
        uses: actions/deploy-pages@v4
