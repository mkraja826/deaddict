name: Build and test Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Java toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Clean stale build outputs
        run: ./gradlew clean --no-build-cache --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew test --no-build-cache --stacktrace

      - name: Run Android lint
        run: ./gradlew lint --no-build-cache --stacktrace

      - name: Build release AAB
        env:
          DEADDICT_SUPABASE_URL: ${{ secrets.DEADDICT_SUPABASE_URL }}
          DEADDICT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEADDICT_SUPABASE_PUBLISHABLE_KEY }}
          DEADDICT_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.DEADDICT_GOOGLE_SERVER_CLIENT_ID }}
        run: |
          ./gradlew :app:bundleRelease \
            -PDEADDICT_SUPABASE_URL="$DEADDICT_SUPABASE_URL" \
            -PDEADDICT_SUPABASE_PUBLISHABLE_KEY="$DEADDICT_SUPABASE_PUBLISHABLE_KEY" \
            -PDEADDICT_GOOGLE_SERVER_CLIENT_ID="$DEADDICT_GOOGLE_SERVER_CLIENT_ID" \
            --no-build-cache \
            --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: deaddict-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deaddict-test-lint-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*.html
            **/build/reports/lint-results*.xml
          if-no-files-found: warn
          retention-days: 14