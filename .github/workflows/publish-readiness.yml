name: Verify production publish candidate

on:
  workflow_dispatch:
    inputs:
      rollout_percent:
        description: Initial staged rollout percentage
        required: true
        default: "5"
        type: string
      allow_wide_rollout:
        description: Allow rollout above 25% after a recorded health review
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate publish secrets and metadata
        env:
          DEADDICT_KEYSTORE_BASE64: ${{ secrets.DEADDICT_KEYSTORE_BASE64 }}
          DEADDICT_KEYSTORE_PASSWORD: ${{ secrets.DEADDICT_KEYSTORE_PASSWORD }}
          DEADDICT_KEY_ALIAS: ${{ secrets.DEADDICT_KEY_ALIAS }}
          DEADDICT_KEY_PASSWORD: ${{ secrets.DEADDICT_KEY_PASSWORD }}
          DEADDICT_SUPABASE_URL: ${{ secrets.DEADDICT_SUPABASE_URL }}
          DEADDICT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEADDICT_SUPABASE_PUBLISHABLE_KEY }}
          DEADDICT_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.DEADDICT_GOOGLE_SERVER_CLIENT_ID }}
          DEADDICT_DEVELOPER_NAME: ${{ secrets.DEADDICT_DEVELOPER_NAME }}
          DEADDICT_SUPPORT_EMAIL: ${{ secrets.DEADDICT_SUPPORT_EMAIL }}
          DEADDICT_SUPPORT_URL: ${{ secrets.DEADDICT_SUPPORT_URL }}
          DEADDICT_PRIVACY_POLICY_URL: ${{ secrets.DEADDICT_PRIVACY_POLICY_URL }}
          DEADDICT_TERMS_URL: ${{ secrets.DEADDICT_TERMS_URL }}
          DEADDICT_ACCOUNT_DELETION_URL: ${{ secrets.DEADDICT_ACCOUNT_DELETION_URL }}
        run: |
          set -euo pipefail
          for name in \
            DEADDICT_KEYSTORE_BASE64 \
            DEADDICT_KEYSTORE_PASSWORD \
            DEADDICT_KEY_ALIAS \
            DEADDICT_KEY_PASSWORD \
            DEADDICT_SUPABASE_URL \
            DEADDICT_SUPABASE_PUBLISHABLE_KEY \
            DEADDICT_GOOGLE_SERVER_CLIENT_ID \
            DEADDICT_DEVELOPER_NAME \
            DEADDICT_SUPPORT_EMAIL \
            DEADDICT_SUPPORT_URL \
            DEADDICT_PRIVACY_POLICY_URL \
            DEADDICT_TERMS_URL \
            DEADDICT_ACCOUNT_DELETION_URL
          do
            test -n "${!name}" || { echo "$name is missing"; exit 1; }
          done

      - name: Restore release keystore
        env:
          DEADDICT_KEYSTORE_BASE64: ${{ secrets.DEADDICT_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$DEADDICT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deaddict-release.jks"
          test -s "$RUNNER_TEMP/deaddict-release.jks"

      - name: Verify and build publish candidate
        env:
          DEADDICT_KEYSTORE_PATH: ${{ runner.temp }}/deaddict-release.jks
          DEADDICT_KEYSTORE_PASSWORD: ${{ secrets.DEADDICT_KEYSTORE_PASSWORD }}
          DEADDICT_KEY_ALIAS: ${{ secrets.DEADDICT_KEY_ALIAS }}
          DEADDICT_KEY_PASSWORD: ${{ secrets.DEADDICT_KEY_PASSWORD }}
          DEADDICT_SUPABASE_URL: ${{ secrets.DEADDICT_SUPABASE_URL }}
          DEADDICT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEADDICT_SUPABASE_PUBLISHABLE_KEY }}
          DEADDICT_GOOGLE_SERVER_CLIENT_ID: ${{ secrets.DEADDICT_GOOGLE_SERVER_CLIENT_ID }}
          DEADDICT_DEVELOPER_NAME: ${{ secrets.DEADDICT_DEVELOPER_NAME }}
          DEADDICT_SUPPORT_EMAIL: ${{ secrets.DEADDICT_SUPPORT_EMAIL }}
          DEADDICT_SUPPORT_URL: ${{ secrets.DEADDICT_SUPPORT_URL }}
          DEADDICT_PRIVACY_POLICY_URL: ${{ secrets.DEADDICT_PRIVACY_POLICY_URL }}
          DEADDICT_TERMS_URL: ${{ secrets.DEADDICT_TERMS_URL }}
          DEADDICT_ACCOUNT_DELETION_URL: ${{ secrets.DEADDICT_ACCOUNT_DELETION_URL }}
          DEADDICT_ROLLOUT_PERCENT: ${{ inputs.rollout_percent }}
          DEADDICT_ALLOW_WIDE_ROLLOUT: ${{ inputs.allow_wide_rollout }}
        run: |
          set -o pipefail
          mkdir -p build-logs
          ./gradlew clean test lint :app:verifyPublishReadiness :app:bundleRelease \
            -PDEADDICT_SUPABASE_URL="$DEADDICT_SUPABASE_URL" \
            -PDEADDICT_SUPABASE_PUBLISHABLE_KEY="$DEADDICT_SUPABASE_PUBLISHABLE_KEY" \
            -PDEADDICT_GOOGLE_SERVER_CLIENT_ID="$DEADDICT_GOOGLE_SERVER_CLIENT_ID" \
            --no-build-cache \
            --stacktrace 2>&1 | tee build-logs/publish-candidate.log

      - name: Verify signed release AAB
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/*.aab

      - name: Generate release checksums
        run: sha256sum app/build/outputs/bundle/release/*.aab > app/build/outputs/bundle/release/SHA256SUMS.txt

      - name: Upload publish candidate
        uses: actions/upload-artifact@v4
        with:
          name: deaddict-1.0.0-publish-candidate
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/SHA256SUMS.txt
            app/build/outputs/mapping/release/**
            build-logs/**
            **/build/reports/**
            docs/legal/**
            docs/play/**
            docs/site/**
