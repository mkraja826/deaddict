name: Validate store preview

on:
  pull_request:
    paths:
      - "app/src/debug/**"
      - "scripts/verify_store_preview.py"
      - "docs/play/SCREENSHOT_CAPTURE.md"
      - ".github/workflows/capture-store-screenshots.yml"
      - ".github/workflows/validate-store-preview.yml"
  push:
    branches:
      - main
    paths:
      - "app/src/debug/**"
      - "scripts/verify_store_preview.py"
      - "docs/play/SCREENSHOT_CAPTURE.md"
      - ".github/workflows/capture-store-screenshots.yml"
      - ".github/workflows/validate-store-preview.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify fictional debug-only boundary
        run: python3 scripts/verify_store_preview.py
